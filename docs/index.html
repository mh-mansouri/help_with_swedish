<style>
  :root {

    --accent: #2f5fa8;
    --tag-channel: #e5edfb;
    --tag-podcast: #eee5fb;
  }

      --bg: #14161a;
      --fg: #eaeaea;
      --muted: #a3a3a3;
      --border: #33363b;
      --card-bg: #1d2025;

      --tag-channel: #22304a;
      --tag-podcast: #2c2240;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    background: var(--bg);

  .lang-switch {

  }
  .lang-switch button {
    font-size: 0.8rem;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }
  p.lead {
    color: var(--muted);
    margin-top: 0;

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: end;
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    flex: 1 1 140px;
  }
  label {
    font-size: 0.85rem;
    color: var(--muted);
  }
  select, button {
    font-size: 1rem;
    padding: 0.5rem 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
  }
  #submit {
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    flex: 1 1 160px;
  }
  #submit:hover { opacity: 0.9; }
  #submit:disabled { opacity: 0.6; cursor: not-allowed; }
  #status {
    margin-top: 1rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  #results {
    list-style: none;
    margin: 1rem 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  #results li {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    background: var(--card-bg);
  }
  .item-name {
    font-weight: 600;
    color: var(--fg);
    text-decoration: none;
  }
  a.item-name:hover {
    text-decoration: underline;
  }
  .tag {
    display: inline-block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    margin-inline-start: 0.5rem;
    vertical-align: middle;
  }
  .tag-channel { background: var(--tag-channel); color: var(--accent); }
  .tag-podcast { background: var(--tag-podcast); color: var(--accent); }

    margin-top: 0.3rem;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .item-levels {
    margin-top: 0.35rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  details.level-guide {
    margin-top: 0.6rem;
    font-size: 0.85rem;
  }
  details.level-guide summary {
    cursor: pointer;
    color: var(--accent);
  }
  table.level-table {
    margin-top: 0.6rem;
    border-collapse: collapse;
    width: 100%;
  }
  table.level-table th, table.level-table td {
    text-align: start;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.level-table th {
    color: var(--muted);
    font-weight: 600;
  }
  footer {
    margin-top: 2.5rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer a { color: var(--accent); }

    font-size: 1.05rem;
    margin: 2rem 0 0.5rem;
  }
  .chat {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    padding: 0.9rem;

    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    max-height: 340px;
    overflow-y: auto;
    margin-bottom: 0.75rem;
  }
  .chat-log:empty { margin-bottom: 0; }
  .msg {
    max-width: 85%;
    padding: 0.55rem 0.75rem;
    border-radius: 10px;
    font-size: 0.92rem;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .msg.error {
    align-self: flex-start;
    background: var(--bg);
    border: 1px solid #c0392b;
    color: #c0392b;
  }
  .msg.pending { color: var(--muted); font-style: italic; }

  [dir="rtl"] .msg.assistant, [dir="rtl"] .msg.error { align-self: flex-end; }
  .chat-form {
    display: flex;
    gap: 0.5rem;
  }
  .chat-form input {
    flex: 1;
    padding: 0.55rem 0.7rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);

    cursor: not-allowed;

    font-size: 0.8rem;

<main>
  <div class="lang-switch" role="group" aria-label="Language / Språk / زبان">
    <button type="button" data-lang="sv" aria-pressed="true">Svenska</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
    <button type="button" data-lang="fa" aria-pressed="false">فارسی</button>
  </div>

  <h1 id="h1">Hitta resurser för att lära dig svenska</h1>
  <p class="lead" id="lead">Välj en nivå och en färdighet. Inget konto, ingen AI-chatt — bara en lista med YouTube-kanaler och poddar.</p>

  <h2 id="askH2">Fråga mentorn</h2>
  <div class="chat" id="chat">
    <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
    <form class="chat-form" id="chatForm">
      <input type="text" id="chatInput" autocomplete="off" maxlength="4000">
      <button type="submit" id="chatSend">Skicka</button>
    </form>
    <p class="chat-note" id="chatNote"></p>
  </div>

  <h2 id="browseH2">Eller bläddra utan chatt</h2>
  <details class="level-guide">
    <summary id="cefrSummary">Inte säker på vad A1–C2 betyder?</summary>
    <table class="level-table">
      <thead>
        <tr><th id="thLevel">Nivå</th><th id="thStage">Steg</th><th id="thWhat">Vad du klarar av</th></tr>
      </thead>
      <tbody id="cefrBody"></tbody>
    </table>
  </details>

  <form id="form">
    <div class="field">
      <label for="level" id="levelLabel">Nivå</label>
      <select id="level" name="level" required>
        <option value="A1">A1</option>
        <option value="A2" selected>A2</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
        <option value="C1">C1</option>
        <option value="C2">C2</option>
      </select>
    </div>
    <div class="field">
      <label for="skill" id="skillLabel">Färdighet</label>
      <select id="skill" name="skill"></select>
    </div>
    <button type="submit" id="submit">Hämta rekommendationer</button>
  </form>

  <p id="status" role="status"></p>
  <ul id="results"></ul>

  <footer id="footer"></footer>
</main>

  div.textContent = text;
  chatLogEl.appendChild(div);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
  return div;
}

async function sendChatMessage(message) {
  const t = I18N[currentLang];
  chatBusy = true;
  chatInputEl.disabled = true;
  chatSendEl.disabled = true;

  appendChatMsg("user", message);
  const pending = appendChatMsg("assistant pending", t.chatThinking);

  try {
    const res = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: message, history: chatHistory, lang: currentLang }),
    });
    if (res.status === 501) {
      pending.remove();
      chatDisabled = true;
      chatInputEl.disabled = true;
      chatSendEl.disabled = true;
      chatNoteEl.textContent = t.chatNotConfigured;
      return;
    }
    if (res.status === 429) {
      pending.className = "msg error";
      pending.textContent = t.chatRateLimited;
      return;
    }
    if (!res.ok) {
      pending.className = "msg error";
      pending.textContent = t.chatError;
      return;
    }
    const data = await res.json();
    pending.className = "msg assistant";
    pending.textContent = data.reply;
    chatHistory.push({ role: "user", content: message });
    chatHistory.push({ role: "assistant", content: data.reply });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
  } catch (err) {
    pending.className = "msg error";
    pending.textContent = t.chatError;
  } finally {
    chatBusy = false;
    if (!chatDisabled) {
      chatInputEl.disabled = false;
      chatSendEl.disabled = false;
      chatInputEl.focus();
    }
  }
}

chatFormEl.addEventListener("submit", (e) => {
  e.preventDefault();
  const message = chatInputEl.value.trim();
  if (!message || chatBusy || chatDisabled) return;
  chatInputEl.value = "";
  sendChatMessage(message);
});

function buildCefrTable(lang) {
  cefrBodyEl.textContent = "";
  for (const [level, stage, desc] of LEVEL_GUIDE[lang]) {
    const tr = document.createElement("tr");
    for (const text of [level, stage, desc]) {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    }
    cefrBodyEl.appendChild(tr);
  }
}

function buildSkillOptions(lang) {
  const previousValue = skillSelect.value;
  skillSelect.textContent = "";
  const labels = I18N[lang].skillOptions;
  SKILL_VALUES.forEach((value, i) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = labels[i];
    skillSelect.appendChild(option);
  });
  skillSelect.value = previousValue || "";
}

function buildFooter(lang) {
  const t = I18N[lang];
  footerEl.textContent = "";
  footerEl.appendChild(document.createTextNode(t.footerPre));

  const apiLink = document.createElement("a");
  apiLink.href = API_BASE + "/docs";
  apiLink.target = "_blank";
  apiLink.rel = "noopener";
  apiLink.textContent = t.footerApiLink;
  footerEl.appendChild(apiLink);

  footerEl.appendChild(document.createTextNode(t.footerMid));

  const skillLink = document.createElement("a");
  skillLink.href = "https://github.com/mh-mansouri/help_with_swedish";
  skillLink.target = "_blank";
  skillLink.rel = "noopener";
  skillLink.textContent = t.footerSkillLink;
  footerEl.appendChild(skillLink);

  footerEl.appendChild(document.createTextNode(t.footerPost));
}

function tagLabel(type, lang) {
  return type === "podcast" ? I18N[lang].tagPodcast : I18N[lang].tagChannel;
}

function clearResults() {
  resultsEl.textContent = "";
}

function renderResults(items, lang) {
  clearResults();
  if (!items || items.length === 0) {
    statusEl.textContent = I18N[lang].noMatches;
    return;
  }
  statusEl.textContent = "";
  for (const item of items) {
    const li = document.createElement("li");

    const nameEl = document.createElement(item.url ? "a" : "span");
    nameEl.className = "item-name";
    nameEl.textContent = item.name;
    if (item.url) {
      nameEl.href = item.url;
      nameEl.target = "_blank";
      nameEl.rel = "noopener";
    }
    li.appendChild(nameEl);

    const tagEl = document.createElement("span");
    tagEl.className = "tag " + (item.type === "podcast" ? "tag-podcast" : "tag-channel");
    tagEl.textContent = tagLabel(item.type, lang);
    li.appendChild(tagEl);

    const descEl = document.createElement("div");
    descEl.className = "item-desc";
    descEl.textContent = item.description;
    li.appendChild(descEl);

    const levelsEl = document.createElement("div");
    levelsEl.className = "item-levels";
    levelsEl.textContent = I18N[lang].levelsPrefix + item.levels.join(", ");
    li.appendChild(levelsEl);

    resultsEl.appendChild(li);
  }
}

function applyLanguage(lang) {
  currentLang = lang;
  const t = I18N[lang];

  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.title = t.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute("content", t.metaDescription);
  document.getElementById("ogTitle").setAttribute("content", t.pageTitle);
  document.getElementById("ogDescription").setAttribute("content", t.metaDescription);
  document.getElementById("ogLocale").setAttribute("content", t.ogLocale);
  document.getElementById("twitterTitle").setAttribute("content", t.pageTitle);
  document.getElementById("twitterDescription").setAttribute("content", t.metaDescription);

  h1El.textContent = t.h1;
  leadEl.textContent = t.lead;
  askH2El.textContent = t.askH2;
  browseH2El.textContent = t.browseH2;
  chatInputEl.placeholder = t.chatPlaceholder;
  chatSendEl.textContent = t.chatSend;
  chatNoteEl.textContent = chatDisabled ? t.chatNotConfigured : t.chatHint;
  cefrSummaryEl.textContent = t.cefrSummary;
  thLevelEl.textContent = t.thLevel;
  thStageEl.textContent = t.thStage;
  thWhatEl.textContent = t.thWhat;
  buildCefrTable(lang);
  levelLabelEl.textContent = t.levelLabel;
  skillLabelEl.textContent = t.skillLabel;
  buildSkillOptions(lang);
  submitButton.textContent = t.submit;
  buildFooter(lang);

  langButtons.forEach((btn) => {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
  });

  if (lastItems) {
    renderResults(lastItems, lang);
  }
}

langButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    localStorage.setItem(LANG_KEY, btn.dataset.lang);
    applyLanguage(btn.dataset.lang);
  });
});

async function fetchRecommendations(level, skill) {
  const url = new URL(API_BASE + "/recommendations");
  url.searchParams.set("level", level);
  if (skill) url.searchParams.set("skill", skill);
  url.searchParams.set("limit", "6");

  const response = await fetch(url.toString());
  if (!response.ok) {
    const body = await response.json().catch(() => null);
    throw new Error(body && body.detail ? body.detail : "Request failed (" + response.status + ")");
  }
  return response.json();
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submitButton.disabled = true;
  clearResults();
  lastItems = null;
  statusEl.textContent = I18N[currentLang].loading;

  try {
    const items = await fetchRecommendations(levelSelect.value, skillSelect.value);
    lastItems = items;
    renderResults(items, currentLang);
  } catch (err) {
    statusEl.textContent = I18N[currentLang].errorPrefix + err.message;
  } finally {
    submitButton.disabled = false;
  }
});

// Swedish first for every new visitor, on purpose — this is a Swedish-learning
// page — regardless of browser language. A choice made with the switcher above
// is still remembered via localStorage and wins on the next visit.
const savedLang = localStorage.getItem(LANG_KEY);
applyLanguage(savedLang && I18N[savedLang] ? savedLang : "sv");
form.dispatchEvent(new Event("submit"));
</script>
</body>
</html>
